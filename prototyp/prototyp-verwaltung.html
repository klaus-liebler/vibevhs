function viewStart() {

  [0, 50, 100, 150, 200].forEach(v => { const y = H - b - (v / 220) * (H - b - 14); bars += '<line x1="' + l + '" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)"/><text x="' + (l - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + v + '</text>'; });
  WEEKS.forEach((w, i) => {
    const h = (w[1] / 220) * (H - b - 14), x = l + i * bw + 5, y = H - b - h, last = i === WEEKS.length - 1;
    bars += '<rect x="' + x + '" y="' + y + '" width="' + (bw - 10) + '" height="' + h + '" rx="3" fill="var(--accent)" opacity="' + (w[1] === max ? 1 : 0.55) + '"><title>' + w[0] + ': ' + w[1] + ' Anmeldungen</title></rect>';

function bookingCheck(c, p) {
  if (state.cancelled[c.id] || c.status === 'abgesagt') return { ok: false, why: 'Der Kurs ist abgesagt.' };
  if (c.status === 'Entwurf') return { ok: false, why: 'Der Kurs ist noch ein Entwurf und nicht freigegeben.' };
  if (c.sicht === 'geschlossen' && p.rollen.indexOf('Stadtwerke Musterstadt') < 0) return { ok: false, why: 'Geschlossener Kurs für ' + c.ziel + '. ' + p.name + ' gehört nicht zur Zielgruppe.' };
  if (c.sicht === 'intern' && p.rollen.indexOf('Integrationskurs') < 0) return { ok: false, why: 'Integrationskurs: Buchung nur mit erfasster Teilnahmeberechtigung (BAMF). Für ' + p.name + ' liegt keine vor.' };
  if (c.id === 'c301' && p.name === 'Mehmet Yılmaz') return { ok: false, why: p.name + ' ist in diesem Kurs bereits angemeldet.' };
  if (c.belegt >= c.max) return { ok: true, warte: true, why: 'Ausgebucht: Anmeldung auf die Warteliste (Platz ' + (c.warte + 1) + ').' };
  return { ok: true };
}

/* Personenliste: Suche zuerst, Filter mit Trefferzahlen, virtuelles Scrollen mit Nachladen */
const ROW_H = 56, CHUNK = 50;
let FL = [], loaded = new Set(), pending = new Set(), flKey = '';
function statusPillP(p) { return '<span class="pill ' + (p.status === 'aktiv' ? 'p-good' : p.status === 'ruhend' ? 'p-mute' : 'p-warn') + '">' + p.status + '</span>'; }
function matches(p, f, ignore) {
  if (f.q && p.key.indexOf(norm(f.q)) < 0) return false;
  if (ignore !== 'rolle' && f.rolle === 'doz' && !p.isDoz) return false;
  if (ignore !== 'rolle' && f.rolle === 'tn' && !p.isTn) return false;
  if (ignore !== 'status' && f.status !== 'alle' && p.status !== f.status) return false;
  return true;
}
function computeFL() {
  const f = state.pf, key = f.q + '|' + f.rolle + '|' + f.status;
  if (key === flKey) return;
  flKey = key; loaded = new Set(); pending = new Set(); state.pScroll = 0;
  FL = PEOPLE_IDS.filter(k => matches(PEOPLE[k], f)).sort((a, b) => { const ga = PEOPLE[a].gen ? 1 : 0, gb = PEOPLE[b].gen ? 1 : 0; return ga - gb || PEOPLE[a].name.localeCompare(PEOPLE[b].name, 'de'); });
}
function facet(kind, val) { const f = Object.assign({}, state.pf); f[kind] = val; return PEOPLE_IDS.filter(k => matches(PEOPLE[k], f)).length; }
function chip(kind, val, label) {
  const on = state.pf[kind] === val;
  return '<button class="btn sm' + (on ? ' pri' : '') + '" data-a="pfilter" data-arg="' + kind + ':' + val + '">' + label + ' <span class="mono" style="opacity:.8">' + facet(kind, val).toLocaleString('de-DE') + '</span></button>';
}
function personListPanel() {
  computeFL();
  return '<section class="card" style="gap:10px"><div class="field"><label for="pq">Suchen (Name, Ort, Geburtsdatum)</label><input id="pq" type="search" data-in="pq" value="' + esc(state.pf.q) + '" placeholder="z. B. yilmaz, mueller, 1988" autocomplete="off"></div>' +
    '<div class="row" style="gap:6px">' + chip('rolle', 'alle', 'Alle') + chip('rolle', 'tn', 'Teilnehmende') + chip('rolle', 'doz', 'Dozierende') + '</div>' +
    '<div class="row" style="gap:6px">' + chip('status', 'alle', 'Jeder Status') + chip('status', 'aktiv', 'aktiv') + chip('status', 'ruhend', 'ruhend') + chip('status', 'Löschung vorgemerkt', 'Löschung vorgemerkt') + '</div>' +
    '<div class="head" style="align-items:center"><b id="pcount">' + FL.length.toLocaleString('de-DE') + ' Treffer</b><span class="small muted" id="pload"></span></div>' +
    '<div id="vlist" style="height:min(560px, 62vh);overflow-y:auto;position:relative;border:1px solid var(--line);border-radius:8px" tabindex="0" aria-label="Personenliste"><div id="vspace" style="position:relative"></div></div>' +
    '<div class="row">' + btn('Alle ' + FL.length.toLocaleString('de-DE') + ' Treffer anschreiben', 'toast', { sm: true, arg: 'Serienmail an alle Treffer des Filters wird als Hintergrundauftrag erstellt; jede Mail mit Übersetzungslink (Mock).' }) + btn('Export (Excel)', 'toast', { sm: true, arg: 'Export des gesamten Filterergebnisses als Excel-Datei (Mock).' }) + '</div></section>';
}
function renderVList() {
  const box = document.getElementById('vlist'), sp = document.getElementById('vspace');
  if (!box || !sp) return;
  sp.style.height = Math.max(FL.length * ROW_H, 1) + 'px';
  const top = box.scrollTop, vh = box.clientHeight || 500;
  const start = Math.max(0, Math.floor(top / ROW_H) - 6), end = Math.min(FL.length, Math.ceil((top + vh) / ROW_H) + 6);
  let h = '';
  if (!FL.length) h = '<div style="padding:16px" class="muted">Keine Treffer. Suchbegriff kürzen oder Filter lockern.</div>';
  for (let i = start; i < end; i++) {
    const c = Math.floor(i / CHUNK), y = i * ROW_H;
    if (!loaded.has(c)) { requestChunk(c); h += '<div style="position:absolute;left:0;right:0;top:' + y + 'px;height:' + ROW_H + 'px;padding:10px 12px;border-bottom:1px solid var(--line)"><div style="height:12px;width:55%;background:var(--surface-2);border-radius:4px"></div><div style="height:10px;width:35%;background:var(--surface-2);border-radius:4px;margin-top:8px"></div></div>'; continue; }
    const k = FL[i], p = PEOPLE[k];
    h += '<button data-a="openPerson" data-arg="' + k + '" style="position:absolute;left:0;right:0;top:' + y + 'px;height:' + ROW_H + 'px;text-align:left;border:0;border-bottom:1px solid var(--line);background:' + (k === state.person ? 'var(--accent-weak)' : 'transparent') + ';padding:8px 12px;cursor:pointer;display:flex;gap:10px;align-items:center"><span style="flex:1;min-width:0;overflow:hidden"><b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(p.name) + '</b><small class="muted">' + p.rollen.join(', ') + ' · ' + esc(p.ort) + (p.fb ? ' · ' + p.fb : '') + '</small></span>' + (p.status !== 'aktiv' ? statusPillP(p) : '') + '</button>';
  }
  sp.innerHTML = h;
  const li = document.getElementById('pload');
  if (li) li.textContent = 'geladen: ' + Math.min(FL.length, loaded.size * CHUNK).toLocaleString('de-DE') + ' von ' + FL.length.toLocaleString('de-DE') + (pending.size ? ' · lädt …' : '');
}
function requestChunk(c) {
  if (pending.has(c) || loaded.has(c)) return;
  pending.add(c);
  const key = flKey;
  setTimeout(() => { if (key !== flKey) return; pending.delete(c); loaded.add(c); renderVList(); }, 350);
}
function initVList() {
  const box = document.getElementById('vlist'); if (!box) return;
  computeFL();
  box.scrollTop = state.pScroll;
  let raf = 0;
  box.addEventListener('scroll', () => { state.pScroll = box.scrollTop; if (!raf) raf = requestAnimationFrame(() => { raf = 0; renderVList(); }); });
  renderVList();
}

  fibu: () => { state.fibuDone = true; addLog('Übergabe an Finanzsoftware: 12 Buchungen, 1.104,00 €'); addOut({ typ: 'Finanzsoftware (CSV)', an: 'Kämmerei', betreff: 'Buchungsübergabe 14.11.2026, 12 Buchungen', body: 'Belegdatum;Personenkonto;Sachkonto;Kostenstelle;Betrag;Text\n14.11.2026;40011284;431100;VHS-SPR;98,00;26H-302 Entgelt\n…' }); toast('Übergabe im Postausgang.'); render(); },
  ikBill: () => { state.ikDone = true; addLog('Integrationskurs 26H-701: Abrechnung Okt./Nov. erstellt und gemeldet (Mock)'); addOut({ typ: 'BAMF (Mock)', an: 'BAMF', betreff: 'Abrechnung 26H-701 Modul 3, Zeitraum 02.–13.11.2026', body: 'Abrechnung Integrationskurs 26H-701, Modul 3\nZeitraum: 02.11.–13.11.2026 · 44 UE\nTeilnehmende: 19 · abrechenbare Teilnahmen nach Anwesenheit je UE\nAnlagen: Anwesenheitsliste (PDF), Abrechnungsbogen (PDF)\nAntwort (simuliert): eingegangen, Vorgang 2026-ABC-0912' }); toast('Abrechnung erstellt.'); render(); },
  ortSel: a => { state.ort = a; render(); },
  ortOpen: a => { state.ort = a; state.ortFilter = 'alle'; state.course = null; go('orte'); },
  ortFilter: a => { state.ortFilter = a; const t = { alle: null, bf: 'bf', bamf: 'bamf' }; render(); },
  bamfRenew: () => { state.bamfRenewed = true; ORTE['B 1.10'].m.forEach(m => { if (m[0] === 'bamf') { m[2] = '2028-09-30'; m[3] = 'InGe-Online, Meldung 2026-1115'; } }); addLog('Kursort B 1.10: BAMF-Meldung erneuert, gültig bis 30.09.2028'); toast('Eingetragen. B 1.10 ist wieder für Integrationskurse planbar.'); render(); },
  genToggle: () => { const c = course(state.course), vs = vasOf(c); state.single = null; state.gen = state.gen ? null : { start: vs.length ? isoAdd(vs[vs.length - 1].d, 7) : toIso(c.beginn), zeit: c.zeit, rh: 1, n: 6, unbef: c.umfang === 'unbefristet', ort: (c.orte || [c.raum])[0], doz: c.doz }; render(); },
  singleToggle: () => { const c = course(state.course); state.gen = null; state.single = state.single ? null : { d: '2026-12-19', zeit: c.zeit, doz: (c.team || [c.doz])[c.team ? 1 : 0], o1: 'Stadtwald' }; if (state.single && !kapOf('Stadtwald', nutzung(c))) state.single.o1 = (c.orte || [c.raum])[0]; render(); },
  genSave: () => { const c = course(state.course), g = state.gen, vs = vasOf(c); const nr = 1 + vs.reduce((m, v) => Math.max(m, Number((v.herkunft.match(/Serie (\d+)/) || [0, 0])[1])), 0); const add = genDates(g).filter(x => !x.skip && !vs.some(v => v.d === x.d)).map(x => ({ d: x.d, zeit: g.zeit, doz: g.doz, orte: [{ o: g.ort, kap: c.kapEigen || null }], herkunft: 'Serie ' + nr })); add.forEach(v => vs.push(v)); vs.sort((a, b) => a.d < b.d ? -1 : 1); state.gen = null; addLog(c.nr + ': ' + add.length + ' Veranstaltungen erzeugt (Serie ' + nr + ', ' + ortName(g.ort) + ', ' + PEOPLE[g.doz].name + ')'); toast(add.length + ' Veranstaltungen angelegt. Ausgelassene Ferientage sind protokolliert.'); render(); },
  singleSave: () => { const c = course(state.course), vs = vasOf(c); const d = document.getElementById('s-d').value || state.single.d, o1 = document.getElementById('s-o1').value, o2 = document.getElementById('s-o2').value, kap = Number(document.getElementById('s-kap').value) || null, doz = document.getElementById('s-doz').value; const orte = [{ o: o1, kap: kap }]; if (o2 && o2 !== o1) orte.push({ o: o2, kap: null }); vs.push({ d: d, zeit: document.getElementById('s-zeit').value || c.zeit, doz: doz, orte: orte, herkunft: 'einzeln' }); vs.sort((a, b) => a.d < b.d ? -1 : 1); state.single = null; addLog(c.nr + ': Einzelveranstaltung ' + dDE(d) + ' in ' + orte.map(x => ortName(x.o)).join(' + ') + ' (' + PEOPLE[doz].name + ')'); toast('Einzelveranstaltung am ' + dDE(d) + ' angelegt' + (orte.length > 1 ? ', hybrid.' : '.')); render(); },
  addOnline: a => { const c = course(state.course), v = vasOf(c).find(x => x.d === a); v.orte.push({ o: nutzung(c) === 'Vortrag' ? 'Online Vortrag' : 'Online 3', kap: null }); v.herkunft = v.herkunft.indexOf('Ausnahme') >= 0 || v.herkunft === 'einzeln' ? v.herkunft : v.herkunft + ', Ausnahme'; addLog(c.nr + ': Veranstaltung ' + dDE(a) + ' zusätzlich online (hybrid)'); toast('Veranstaltung am ' + dDE(a) + ' ist jetzt hybrid. Online-Teilnehmende bekommen den Link 24 Stunden vorher.'); render(); },
  vaBook: a => { state.k.res.push(a); const p = a.split('|'); addLog('Vorab-Einbuchung: ' + PEOPLE[state.k.p].name + ' für ' + dDE(p[0]) + ' (' + ortName(p[1]) + ')'); toast('Eingebucht. Verbleibend im Kontingent: ' + kRest() + '.'); render(); },
  vaUnbook: a => { state.k.res = state.k.res.filter(x => x !== a); addLog('Einbuchung ausgetragen: ' + PEOPLE[state.k.p].name + ', ' + dDE(a.split('|')[0])); toast('Ausgetragen. Der Platz ist wieder frei, die Einheit zurück im Kontingent.'); render(); },
  checkinNo: () => toast('Check-in abgelehnt: Thomas Wagner ist für Mo 16.11.2026 nicht eingebucht, und die Veranstaltung ist voll (14 von 14). Hinweis: bitte am Tresen melden.'),
  kPerson: a => { if (PEOPLE[a]) { if (a !== state.k.p) state.k = { p: a, n: 10, besucht: a === 'p-weber' ? 4 : (a === 'p-demir' ? 9 : 0), verfallen: a === 'p-demir' ? 1 : (a === 'p-weber' ? 1 : 0), res: [], bis: '2027-05-14' }; } else toast('Beispielperson ohne Detaildaten; eingebucht wird hier für ' + PEOPLE[state.k.p].name + '.'); state.course = 'c540'; state.tab = 'termine'; go('kurse'); },
  showPast: () => { state.showPast = !state.showPast; render(); },
  outSel: a => { state.outSel = Number(a); render(); },
  claim: a => { const t = TASKS.find(x => x.id === a); t.who = 'me'; addLog('Aufgabe übernommen: ' + t.txt); toast('Übernommen. Die Gruppe sieht, dass Sie daran arbeiten.'); render(); },
  assign: a => { const t = TASKS.find(x => x.id === a); t.who = 'M. Öztürk'; addLog('Aufgabe an M. Öztürk zugewiesen: ' + t.txt); toast('An M. Öztürk zugewiesen. Sie wird benachrichtigt.'); render(); },
  pfilter: a => { const i = a.indexOf(':'); state.pf[a.slice(0, i)] = a.slice(i + 1); render(); },
  allHits: a => { state.pf = { q: a, rolle: 'alle', status: 'alle' }; go('personen'); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const a = el.getAttribute('data-a');
  if (!ACTIONS[a]) return;
  if (el.tagName === 'A') e.preventDefault();
  ACTIONS[a](el.getAttribute('data-arg'));
});
document.addEventListener('change', e => {
  const k = e.target.getAttribute && e.target.getAttribute('data-in');
  if (k === 'pay') { state.wiz.pay = e.target.value; render(); }
  if (k && k.indexOf('gen-') === 0 && state.gen) { const f = k.slice(4); state.gen[f] = f === 'unbef' ? e.target.checked : (f === 'n' || f === 'rh' ? Number(e.target.value) || 1 : e.target.value); render(); }
  if (k && k.indexOf('sg-') === 0 && state.single) { state.single[k.slice(3)] = e.target.value; render(); }
  if (k === 'hist-g') { state.histG = e.target.value || state.histG; render(); }
  if (k === 'hist-b') { state.histB = e.target.value || state.histB; render(); }
  if (k === 'termin') { state.att.termin = e.target.value.slice(0, 10); render(); }
});
document.addEventListener('input', e => {
  if (e.target.getAttribute && e.target.getAttribute('data-in') === 'pq') {
    state.pf.q = e.target.value; const pos = e.target.selectionStart; render();
    const i = document.getElementById('pq'); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (err) {} }
    return;
  }
  if (e.target.getAttribute && e.target.getAttribute('data-in') === 'wq') {
    state.wiz.q = e.target.value; const pos = e.target.selectionStart; render();
    const i = document.getElementById('wq'); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (err) {} }
  }
});

/* Globale Suche */
const q = document.getElementById('q'), res = document.getElementById('results');
q.addEventListener('input', () => {
  const s = q.value.trim().toLowerCase();
  if (s.length < 2) { res.hidden = true; return; }
  const ns = norm(s);
  const ph = PEOPLE_IDS.filter(k => PEOPLE[k].key.indexOf(ns) >= 0);
  const ch = COURSES.filter(c => norm(c.titel + ' ' + c.nr).indexOf(ns) >= 0);
  const oh = Object.keys(ORTE).filter(k => norm(k + ' ' + ORTE[k].name + ' ' + (ORTE[k].adr || '') + ' ' + ORTART[ORTE[k].art] + ' ' + Object.keys(merkmale(k)).map(m => MERKMALE[m].n).join(' ')).indexOf(ns) >= 0);
  const nOrt = Math.min(3, oh.length);
  const hits = ch.slice(0, 3).map(c => '<button data-a="openCourse" data-arg="' + c.id + '">' + c.nr + ' ' + esc(c.titel) + '<small>Kurs</small></button>')
    .concat(oh.slice(0, 3).map(k => '<button data-a="ortOpen" data-arg="' + esc(k) + '">' + esc(ORTE[k].name) + '<small>' + ORTART[ORTE[k].art] + (ORTE[k].parent ? ' · ' + esc(ORTE[ORTE[k].parent].name) : '') + '</small></button>'))
    .concat(ph.slice(0, Math.max(2, 8 - Math.min(3, ch.length) - nOrt)).map(k => '<button data-a="openPerson" data-arg="' + k + '">' + esc(PEOPLE[k].name) + '<small>' + esc(PEOPLE[k].ort) + ' · Person</small></button>'));
  res.innerHTML = (hits.length ? hits.join('') : '<div style="padding:10px 12px" class="muted">Keine Treffer</div>') + (ph.length > Math.max(2, 8 - Math.min(3, ch.length) - nOrt) ? '<button data-a="allHits" data-arg="' + esc(s) + '"><b>Alle ' + ph.length.toLocaleString('de-DE') + ' Personen-Treffer anzeigen</b><small>in der Personenliste</small></button>' : '');
  res.hidden = false;
});
document.getElementById('nav').addEventListener('click', e => { const l = e.target.closest('a'); if (!l) return; state.course = null; if (l.getAttribute('href') === location.hash) { e.preventDefault(); render(); } });
document.addEventListener('click', e => { if (!e.target.closest('.search')) res.hidden = true; else if (e.target.closest('#results [data-a]')) { res.hidden = true; q.value = ''; } });
const roleSel = document.getElementById('role');
roleSel.addEventListener('change', () => { state.role = roleSel.value; toast('Rolle gewechselt: ' + ROLES[state.role] + '. Buttons und Hinweise passen sich an.'); render(); });
window.addEventListener('hashchange', () => { if (current() !== 'kurse') state.course = null; render(); });
render();
})();
