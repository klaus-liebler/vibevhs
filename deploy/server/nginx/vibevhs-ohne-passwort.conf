# VibeVHS-Pfade, die OHNE das gemeinsame Zugangspasswort (Basic Auth) erreichbar sind.
# Ziel: /etc/nginx/snippets/vibevhs-ohne-passwort.conf · nach Änderungen: sudo nginx -t && sudo systemctl reload nginx
#
# Standard im Testbetrieb: alles hinter Passwort, AUSSER
#   - Kalender-Abos (ICS): Kalender-Apps können kein Basic-Auth-Passwort mitschicken; die Adresse enthält ein geheimes Token.
#   - Check-in-Links und Termin-QR (/checkin, /k): werden im Kursraum mit dem Handy gescannt; Token im Link, Rate-Limit in der App.
# Die übrigen Zeilen bei Bedarf einkommentieren (Begründung jeweils dabei).

# Kalender-Abos (Teilnehmende, Dozierende)
location ^~ /vibevhs/portal/teilnehmende/kalender { include /etc/nginx/snippets/vibevhs-proxy.conf; }
location ^~ /vibevhs/portal/dozierende/kalender   { include /etc/nginx/snippets/vibevhs-proxy.conf; }

# Check-in per Link/QR und Kurs-QR (Kursraum, Programmheft)
location ^~ /vibevhs/checkin { include /etc/nginx/snippets/vibevhs-proxy.conf; }
location ^~ /vibevhs/k/      { include /etc/nginx/snippets/vibevhs-proxy.conf; }

# Für den Webshop/TYPO3 auf fremder Website: Buchungs-API und Web-Komponente müssen öffentlich sein (CORS, Proof-of-Work in der App)
# location ^~ /vibevhs/api/v1/shop { include /etc/nginx/snippets/vibevhs-proxy.conf; }
# location ^~ /vibevhs/shop/        { include /etc/nginx/snippets/vibevhs-proxy.conf; }
# location ^~ /vibevhs/_framework/  { include /etc/nginx/snippets/vibevhs-proxy.conf; }

# Übersetzungs-QR auf Briefen und Links in Mails (Empfänger sind keine Testnutzer)
# location ^~ /vibevhs/brief/      { include /etc/nginx/snippets/vibevhs-proxy.conf; }
# location ^~ /vibevhs/uebersetzen/ { include /etc/nginx/snippets/vibevhs-proxy.conf; }

# Portale für echte Teilnehmende/Kursleitungen (Anmeldung per Link; dafür braucht es auch _framework/_blazor/_content)
