# Node-RED – Ziel: /etc/nginx/liebler.d/nodered.conf (VibeVHS-Kit, Schritt 03; gemeinsames Schema in schritte/liebler-nginx.sh)

# ---------- Node-RED ----------
# Node-RED (nodered.service, Benutzer nodered) lauscht nach Schritt 04 nur noch auf 127.0.0.1:1880, ohne eigenes TLS,
# mit httpAdminRoot/httpNodeRoot = /nodered. HTTPS nach außen macht nginx mit dem Hochschulzertifikat.
location = /nodered { return 301 /nodered/; }
location /nodered/ {
    proxy_pass         http://127.0.0.1:1880;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
    proxy_set_header   Host $host;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
}
