# nginx für liebler.iui.hs-osnabrueck.de – GRUNDGERÜST: TLS, :80 → :443, statische Seiten aus /var/www/html und
# „include /etc/nginx/liebler.d/*.conf;“. Die Apps (VibeVHS, Node-RED, FraktionPerfekt, Podium …) liegen je in einer eigenen
# Datei in /etc/nginx/liebler.d/ und werden von ihren Kits gepflegt – niemand überschreibt die Einträge der anderen.
# Ziel: /etc/nginx/sites-available/liebler.conf (Schritt 03 legt sie ab und verlinkt sie nach sites-enabled).
# Das Zertifikat kommt aus /etc/nginx/snippets/liebler-zertifikat.conf:
#   Hochschulzertifikat (GEANT/HARICA) aus /etc/ssl/liebler – Schritt 03 übernimmt es, tauschen mit werkzeuge/zertifikat-tauschen.sh.

# WebSockets (Blazor Server, Node-RED-Editor)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Port 80: nur Umleitung auf HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name liebler.iui.hs-osnabrueck.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name liebler.iui.hs-osnabrueck.de;

    include /etc/nginx/snippets/liebler-zertifikat.conf;

    # ---------- Apps: je eine Datei in /etc/nginx/liebler.d/ (vibevhs, nodered, fraktionperfekt, podium …) ----------
    include /etc/nginx/liebler.d/*.conf;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS erst einschalten, wenn alles über HTTPS sicher läuft (Abschnitt „Danach“ im Runbook)
    # add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    server_tokens off;
    client_max_body_size 20m;

    # Bisherige Apache-Inhalte (statisch): /var/www/html mit index.html, rgb/, simplesorter/
    root /var/www/html;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}
