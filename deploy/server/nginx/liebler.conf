# nginx für liebler.iui.hs-osnabrueck.de: Reverse Proxy vor Node-RED (/nodered) und VibeVHS (/vibevhs).
# Ziel: /etc/nginx/sites-available/liebler.conf (Schritt 03 legt sie ab und verlinkt sie nach sites-enabled).
# Das Zertifikat kommt aus /etc/nginx/snippets/liebler-zertifikat.conf:
#   Schritt 03: vorhandenes Hochschul-Zertifikat (wie bisher bei Apache) – kein Ausfall beim Wechsel.
#   Schritt 05: Let's-Encrypt-Zertifikat (automatische Erneuerung per certbot.timer).

# WebSockets (Blazor Server, Node-RED-Editor)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Port 80: nur Let's-Encrypt-Prüfung (HTTP-01) und Umleitung auf HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name liebler.iui.hs-osnabrueck.de;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name liebler.iui.hs-osnabrueck.de;

    include /etc/nginx/snippets/liebler-zertifikat.conf;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS erst einschalten, wenn alles über HTTPS sicher läuft (Schritt 05, Abschnitt „Danach“ im Runbook)
    # add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    server_tokens off;
    client_max_body_size 20m;

    # Startseite: vorerst eine schlichte Übersicht (bisherige Apache-Inhalte siehe Runbook, Schritt 03)
    location = / {
        default_type text/html;
        return 200 '<!doctype html><meta charset="utf-8"><title>liebler.iui.hs-osnabrueck.de</title><ul><li><a href="/vibevhs/">VibeVHS (Testsystem)</a></li><li><a href="/nodered/">Node-RED</a></li></ul>';
    }

    # ---------- Node-RED ----------
    # Node-RED läuft nur noch auf 127.0.0.1:1880 mit httpAdminRoot/httpNodeRoot = /nodered (siehe nodered/settings-ausschnitt.js).
    location = /nodered { return 301 /nodered/; }
    location /nodered/ {
        proxy_pass         http://127.0.0.1:1880;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # ---------- VibeVHS (Testsystem) ----------
    # Kestrel lauscht nur auf 127.0.0.1:5080; die Anwendung kennt die Pfad-Basis /vibevhs (PathBase).
    location = /vibevhs { return 301 /vibevhs/; }

    # Ohne Zugangspasswort erreichbar (Kalender-Abos, Check-in-Links …) – Auswahl in dieser Datei:
    include /etc/nginx/snippets/vibevhs-ohne-passwort.conf;

    # Statische Dateien (Stile, Skripte, Bilder, Schriften) ohne Passwort, damit auch die freigegebenen Seiten vollständig laden.
    # Bewusst NICHT .json/.xml/.ics/.pdf/.csv/.xlsx: Auskünfte, Exporte und Belege bleiben hinter dem Passwort.
    location ~* ^/vibevhs/.+\.(css|js|mjs|png|svg|ico|webp|jpg|jpeg|woff2?)$ {
        include /etc/nginx/snippets/vibevhs-proxy.conf;
    }

    location /vibevhs/ {
        auth_basic           "VibeVHS Testsystem";
        auth_basic_user_file /etc/nginx/vibevhs.htpasswd;
        include /etc/nginx/snippets/vibevhs-proxy.conf;
    }
}
