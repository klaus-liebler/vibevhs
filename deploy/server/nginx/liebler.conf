# nginx für liebler.iui.hs-osnabrueck.de: Reverse Proxy vor Node-RED (/nodered) und VibeVHS (/vibevhs).
# Ziel: /etc/nginx/sites-available/liebler.conf (Schritt 03 legt sie ab und verlinkt sie nach sites-enabled).
# Das Zertifikat kommt aus /etc/nginx/snippets/liebler-zertifikat.conf:
#   Hochschulzertifikat (GEANT/HARICA) aus /etc/ssl/liebler – Schritt 03 übernimmt es, tauschen mit werkzeuge/zertifikat-tauschen.sh.

# WebSockets (Blazor Server, Node-RED-Editor)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Port 80: nur Umleitung auf HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name liebler.iui.hs-osnabrueck.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name liebler.iui.hs-osnabrueck.de;

    include /etc/nginx/snippets/liebler-zertifikat.conf;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS erst einschalten, wenn alles über HTTPS sicher läuft (Abschnitt „Danach“ im Runbook)
    # add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    server_tokens off;
    client_max_body_size 20m;

    # Bisherige Apache-Inhalte (statisch): /var/www/html mit index.html, rgb/, simplesorter/
    root /var/www/html;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }

    # ---------- Node-RED ----------
    # Node-RED (nodered.service, Benutzer nodered) lauscht nach Schritt 04 nur noch auf 127.0.0.1:1880, ohne eigenes TLS,
    # mit httpAdminRoot/httpNodeRoot = /nodered. HTTPS nach außen macht nginx mit dem Hochschulzertifikat.
    location = /nodered { return 301 /nodered/; }
    location /nodered/ {
        proxy_pass         http://127.0.0.1:1880;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # ---------- VibeVHS (Testsystem) ----------
    # Kestrel lauscht nur auf 127.0.0.1:5080; die Anwendung kennt die Pfad-Basis /vibevhs (PathBase).
    location = /vibevhs { return 301 /vibevhs/; }

    # Ohne Zugangspasswort erreichbar (Kalender-Abos, Check-in-Links …) – Auswahl in dieser Datei:
    include /etc/nginx/snippets/vibevhs-ohne-passwort.conf;

    # Statische Dateien (Stile, Skripte, Bilder, Schriften) ohne Passwort, damit auch die freigegebenen Seiten vollständig laden.
    # Bewusst NICHT .json/.xml/.ics/.pdf/.csv/.xlsx: Auskünfte, Exporte und Belege bleiben hinter dem Passwort.
    location ~* ^/vibevhs/.+\.(css|js|mjs|png|svg|ico|webp|jpg|jpeg|woff2?)$ {
        include /etc/nginx/snippets/vibevhs-proxy.conf;
    }

    location /vibevhs/ {
        auth_basic           "VibeVHS Testsystem";
        auth_basic_user_file /etc/nginx/vibevhs.htpasswd;
        include /etc/nginx/snippets/vibevhs-proxy.conf;
    }
}
