# SSH-Härtung – Ziel: /etc/ssh/sshd_config.d/10-vibevhs.conf (Schritt 01)
# Erst einspielen, wenn die Anmeldung mit Schlüssel nachweislich klappt (Schritt 01 prüft das).
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers srvadmin
X11Forwarding no
MaxAuthTries 4
LoginGraceTime 30
