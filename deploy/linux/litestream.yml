# Litestream: fortlaufende Replikation der SQLite-Datenbank (Vorlage für den späteren Linux-Server).
# Litestream liest das WAL der laufenden Datenbank und spiegelt es in ein Ziel (Datei, S3-kompatibel, SFTP).
# Installation: https://litestream.io/install/  ·  Dienst: litestream replicate -config /etc/litestream.yml
#
# Voraussetzung: VibeVHS betreibt SQLite im WAL-Modus (Standard von EF Core/Microsoft.Data.Sqlite: ja, sobald
# „PRAGMA journal_mode=WAL“ gesetzt ist – siehe docs/betrieb.md).
dbs:
  - path: /var/lib/vibevhs/data/vibevhs.db
    replicas:
      # 1) Lokale Kopie auf einem zweiten Datenträger (einfachster Start)
      - type: file
        path: /mnt/sicherung/vibevhs
        retention: 336h          # 14 Tage
        snapshot-interval: 24h
      # 2) Optional: S3-kompatibler Speicher des kommunalen Rechenzentrums (Zugangsdaten nur als Umgebungsvariablen)
      # - type: s3
      #   endpoint: https://s3.rechenzentrum.example
      #   bucket: vibevhs-sicherung
      #   path: vhs-egs
      #   retention: 720h
      #   access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
      #   secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
# Wiederherstellung (Probe regelmäßig!):
#   litestream restore -config /etc/litestream.yml -o /tmp/vibevhs-probe.db /var/lib/vibevhs/data/vibevhs.db
#   sqlite3 /tmp/vibevhs-probe.db "PRAGMA integrity_check;"
