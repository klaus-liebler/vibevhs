# nginx als Reverse Proxy vor VibeVHS unter https://liebler.iui.hs-osnabrueck.de/vibevhs/
# - Basic Auth (gemeinsames Zugangspasswort) VOR der Testanmeldung:
#     htpasswd -c /etc/nginx/vibevhs.htpasswd vhs-test
# - Blazor Server braucht WebSockets, daher Upgrade-Header und lange Timeouts.
# - In /etc/vibevhs.env: PathBase=/vibevhs (ist in appsettings.Testsystem.json bereits gesetzt)
#
# Diesen Block in den vorhandenen server { listen 443 ssl; server_name liebler.iui.hs-osnabrueck.de; ... } einfügen.
# Die map-Direktive gehört in den http-Kontext (z. B. /etc/nginx/conf.d/websocket-map.conf):
#
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }

location = /vibevhs {
    return 301 /vibevhs/;
}

location /vibevhs/ {
    auth_basic           "VibeVHS Testsystem";
    auth_basic_user_file /etc/nginx/vibevhs.htpasswd;

    proxy_pass         http://127.0.0.1:5189;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
    proxy_set_header   Host $host;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host $host;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    client_max_body_size 20m;
}
